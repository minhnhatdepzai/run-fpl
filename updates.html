<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3ea3e0">
  <meta name="description" content="Liên hệ Lê Minh Nhật — AI Engineer & Creative Developer.">
  <!-- A mailing-list page has no business in anyone's search results or in a
       chat preview: it is the far side of a button inside the game. -->
  <meta name="robots" content="noindex">
  <title>Run FPL — Lê Minh Nhật</title>
  <link rel="icon" href="icon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <script type="module" crossorigin src="bundle/updates-local.js"></script>
  <link rel="modulepreload" crossorigin href="bundle/socials-BEwiKBee.js">
  <link rel="stylesheet" crossorigin href="bundle/updates-Ct5875gy.css">
  <style>
    .updates-language { position:absolute; top:18px; right:20px; border:1px solid #29496233; border-radius:999px; padding:8px 13px; color:#294962; background:#fff8e9cc; font-weight:700; cursor:pointer }
    @media (max-width:520px) { .updates-language { top:10px; right:10px; padding:7px 11px } }
  </style>
</head>
<body>
  <main class="updates">
    <!-- The full-screen logo's sky from the dashboard's marketing page
         (scripts/dashboard/marketing/marketing-scene.js),
         rendered without the wordmark: the card stands where the wordmark does,
         a clay cloud behind either end of it. A narrow screen gets the same sky
         with the clouds under the card, where a phone still shows them. -->
    <picture>
      <source media="(max-aspect-ratio: 1/1)" srcset="./bundle/sky-portrait-CbbFnWR9.webp" width="1200" height="2000">
      <img class="updates-plate" src="bundle/sky-landscape-C8qM24kU.webp" alt="" width="2560" height="1440" decoding="async">
    </picture>

    <div class="updates-card">
      <button class="updates-language" id="updates-language" type="button" aria-label="Ngôn ngữ">VI</button>
      <img class="updates-logo" src="bundle/logo-C8LjbK78.webp" alt="Run FPL" width="1600" height="456">
      <p class="eyebrow" id="updates-eyebrow">RUN FPL · LÊ MINH NHẬT</p>
      <h1>Kết nối với tôi.</h1>
      <p class="updates-lead">AI Engineer &amp; Creative Developer · 0707 193 002</p>

      <form class="updates-form" id="signup-form" novalidate>
        <!-- The placeholder says what the field is; the label is for whoever
             is not looking at it. -->
        <label class="updates-label" for="signup-email">Địa chỉ email</label>
        <div class="updates-field">
          <input class="updates-input" id="signup-email" name="email" type="email" inputmode="email"
            autocomplete="email" autocapitalize="off" spellcheck="false" maxlength="254"
            placeholder="you@example.com" required aria-describedby="signup-status">
          <button class="updates-submit" id="signup-submit" type="submit">Lưu email</button>
        </div>
        <p class="updates-status" id="signup-status" role="status" aria-live="polite"></p>
      </form>

      <div id="updates-social" class="updates-social" aria-label="Liên hệ Lê Minh Nhật"></div>
      <a class="updates-back" href="index.html">Quay lại Run FPL</a>
    </div>
  </main>
</body>
</html>
